[project]
name = "gcode"
version = "0.2.0"
description = "GCode — a local, interactive AI coding CLI."
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.14",
    "langchain-openai>=1.4.3",
    "langchain-core>=1.5.4",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "coverage>=7",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "ruff>=0.16.2",
]

[project.scripts]
gcode = "gcode.cli:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gcode*"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["gcode", "tests"]
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "SIM102",  # nested if reads clearer than a combined condition
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["tests", "demo"]
skips = [
    "B404",  # subprocess import is intentional (git + bash tools)
    "B603",  # list-argument subprocess calls are safe (no shell)
]

[tool.coverage.run]
source = ["gcode"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = true
